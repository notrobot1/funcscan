<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FuncGraph — Dependency Graph</title>
  <link rel="stylesheet" href="/app.css">

  <!-- Graphology (graph data structure) -->
  <script src="/vendor/graphology.min.js"></script>
  <!-- Sigma.js v2 — WebGL graph renderer -->
  <script src="/vendor/sigma.min.js"></script>
  <!-- d3-force layout (UMD, no bundler needed) -->
  <script src="/vendor/d3-dispatch.min.js"></script>
  <script src="/vendor/d3-quadtree.min.js"></script>
  <script src="/vendor/d3-timer.min.js"></script>
  <script src="/vendor/d3-force.min.js"></script>
  <!-- highlight.js (read-only code display) -->
  <script src="/vendor/highlight.min.js"></script>
</head>
<body>
<div id="app">

  <!-- ── Toolbar ──────────────────────────────────────────────────────── -->
  <div id="toolbar">
    <span class="toolbar-label">FuncGraph</span>
    <div class="toolbar-sep"></div>
    <input id="search" type="search" placeholder="Search function…" autocomplete="off">
    <div class="toolbar-sep"></div>
    <button class="btn" id="btn-layout" title="Run / stop force layout">▶ Layout</button>
    <button class="btn" id="btn-fit"    title="Fit all nodes in view">⤢ Fit</button>
    <button class="btn" id="btn-callers-only" title="Show only callers direction">↑ Callers</button>
    <button class="btn" id="btn-callees-only" title="Show only callees direction">↓ Callees</button>
    <span class="ml-auto"></span>
    <span id="node-count" style="color:var(--text-dim);font-size:12px"></span>
  </div>

  <!-- ── Main area ─────────────────────────────────────────────────────── -->
  <div id="main">

    <!-- Graph canvas -->
    <div id="graph-container">
      <div id="sigma-canvas"></div>

      <!-- Loading overlay -->
      <div id="loading">
        <div class="spinner"></div>
        <span id="loading-text">Loading graph…</span>
      </div>
    </div>

    <!-- Code panel (slides in from right, overlays graph) -->
    <div id="code-panel">
      <div id="panel-resize" title="Drag to resize"></div>
      <div id="panel-header">
        <div>
          <div class="fn-name" id="panel-fn-name"></div>
          <div class="file-path" id="panel-file-path"></div>
        </div>
        <button id="panel-close" title="Close panel">✕</button>
      </div>
      <div id="panel-meta"></div>
      <div id="code-scroll">
        <div id="code-output" class="code-loading">Select a function to view its source.</div>
      </div>
    </div>

  </div>

  <!-- ── Status bar ────────────────────────────────────────────────────── -->
  <div id="status-bar">
    <span id="st-nodes">nodes: 0</span>
    <span id="st-edges">edges: 0</span>
    <span id="st-zoom">zoom: 1.00</span>
    <span id="st-hover" style="margin-left:auto"></span>
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-file" id="tt-file"></div>
  <div class="tt-stats" id="tt-stats"></div>
</div>

<!-- Search results dropdown -->
<div id="search-results"></div>

<script src="/app.js"></script>
</body>
</html>
